name: Bot tin hieu co phieu

on:
  schedule:
    # Giờ ghi theo UTC. Giờ Việt Nam = UTC + 7
    # Lịch của GitHub hay bị trễ, nên chỉ dùng để "mồi" bot chạy lần đầu trong ngày.
    # Sau đó bot tự hẹn lần chạy tiếp theo (xem bước cuối cùng bên dưới).
    - cron: '*/5 2-7 * * 1-5'
    # Chạy thêm lúc 15h05 (giờ VN) để chốt giá đóng cửa + gửi tổng kết phiên
    - cron: '5 8 * * 1-5'
  workflow_dispatch: # cho phép bấm nút "Run workflow" để chạy tay

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # cho phép bot tự gọi lần chạy tiếp theo

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Lay code
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chay bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LINK: ${{ vars.TELEGRAM_LINK }}
        run: python bot.py

      - name: Luu danh sach tin da gui (tranh gui trung)
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Cap nhat trang thai bot"
            git pull --rebase
            git push
          fi

      - name: Dong goi trang web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Dang trang web
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Hen lan chay tiep theo (khoang 5 phut sau)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 140
          GIO=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          THU=$(TZ=Asia/Ho_Chi_Minh date +%u)
          if [ "$THU" -le 5 ] && [ "$GIO" -ge 0855 ] && [ "$GIO" -lt 1505 ]; then
            gh workflow run bot.yml --ref main --repo "$GITHUB_REPOSITORY"
            echo "Da hen lan chay tiep theo"
          else
            echo "Ngoai gio giao dich - khong hen lan sau"
          fi
